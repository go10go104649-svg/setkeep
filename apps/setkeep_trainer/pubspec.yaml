name: setkeep_trainer
description: SETKEEP TRAINER companion app
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  setkeep:
    path: ../..
  supabase_flutter: ^2.17.2
  qr_flutter: ^4.1.0
  video_player: ^2.14.0
dev_dependencies:
  integration_test:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/res/drawable-xxxhdpi/launch_logo.png
    - ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@3x.png
    - assets/brand/trainer_icon.png
